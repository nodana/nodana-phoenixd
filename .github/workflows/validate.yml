name: Validate node bundle tooling
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --manifest-path tools/Cargo.toml -- --check
      - run: cargo test --manifest-path tools/Cargo.toml --locked
      - run: cargo fmt --manifest-path launcher/Cargo.toml -- --check
      - run: cargo test --manifest-path launcher/Cargo.toml --locked
      - run: git diff --check
