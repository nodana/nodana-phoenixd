[package]
name = "nodana-bundle-tools"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ndn-bundle"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
hex = "0.4"
libc = "0.2"
openssl = "0.10"
regex = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
zeroize = "1"

